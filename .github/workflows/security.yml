name: Terraform security checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - name: Check formatting
        run: terraform -chdir=terraform fmt -check

      - name: Initialise without a backend
        run: terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate configuration
        run: terraform -chdir=terraform validate

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Checkov
        run: |
          python3 -m venv /tmp/checkov
          /tmp/checkov/bin/pip install --no-cache-dir checkov==3.3.30

      - name: Scan Terraform
        run: /tmp/checkov/bin/checkov -d terraform --framework terraform --compact --skip-download
